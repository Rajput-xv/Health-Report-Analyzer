<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Health Report Analyzer</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
    main { max-width: 460px; width: 100%; padding: 40px 28px; text-align: center; background: #fff;
      border-radius: 16px; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18); }
    .code { margin: 0; font-size: 3.5rem; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 12px 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 24px; color: #6b7280; }
    nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a { padding: 10px 20px; border-radius: 999px; font-weight: 600; text-decoration: none; }
    .primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
    .secondary { border: 1px solid rgba(102, 126, 234, 0.4); color: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(135deg, #0f172a 0%, #1f2937 100%); color: #e5e7eb; }
      main { background: #0b1220; }
      p { color: #9ca3af; }
      .secondary { color: #a5b4fc; }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <nav>
      <a class="primary" href="/">Go to home</a>
      <a class="secondary" href="/blog">Read the blog</a>
    </nav>
  </main>
</body>
</html>
