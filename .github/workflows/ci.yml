name: CI
on: [push, pull_request]
jobs:
  Backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      MONGODB_URI: mongodb://localhost:27017/testdb
      PORT: 5001
      NODE_ENV: development
      JWT_SECRET: your-secure-random-string
      SESSION_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
      EMAIL_USER: your-email@gmail.com
      EMAIL_PASS: your-app-password
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Start server and check health
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/api/health" | grep -q '"database":"Connected"'; then
              echo "API is up and connected to MongoDB"
              exit 0
            fi
            sleep 1
          done
          echo "API did not report a connected database. Server log:"
          cat server.log
          exit 1
  Frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
